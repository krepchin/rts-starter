<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiberium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon512.png">
<title>Tiberium Skirmish — RTS Starter v10.1 NEXT</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css?v=10.1n">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <aside id="sidebar">
    <div id="topDisplay" class="bevel">
      <div id="hud"><div id="credits">$0</div><div id="power">⚡ 0/0</div></div>
      <div id="powerBar" title="Power: produced (top) vs used (bottom)"><div id="powerMade"></div><div id="powerUsed"></div></div>
      <canvas id="minimap" width="180" height="180"></canvas>
    </div>
    <div id="buildTabs"></div>
    <div id="buildMenu"></div>
    <div id="infoPanel" class="bevel">
      <div id="qStatus"></div>
      <div id="selInfo"></div>
      <div id="selActions"></div>
    </div>
    <div id="bottomStrip" class="bevel">
      <div id="radarSweep" title="Radar"></div>
      <div id="queueCtl">
        <button id="volBtn" class="sq" title="Sound: off / low / med / high (remembered)">🔉</button><button id="musBtn" class="sq" title="Music on/off (remembered)">♫</button>
        <button id="findBtn" class="sq" title="Find my units (Space / F, or double-tap a unit)">◎</button>
        <button id="qPause" class="sq" title="Pause queue">❚❚</button>
        <button id="qCancel" class="sq" title="Cancel last / stop placing">✕</button>
      </div>
      <div id="scopeDial" title="Power level"><i></i></div>
    </div>
  </aside>
  <div id="banner" hidden></div>
  <div id="graceTimer" hidden></div>
  <div id="startMenu">
    <div class="panel">
      <h1>Tiberium Skirmish</h1>
      <div id="version">v10.1 NEXT · staging (reptiles, buildings, air)</div>
      <div id="factionPick" role="radiogroup" aria-label="Choose your faction">
        <label class="fac" data-fac="human"><input type="radio" name="faction" value="human" checked><img src="assets/portrait_human.jpg?v=10.1n" alt="" width="320" height="240"><span><b>Humans</b><small>Tiberium-age army: riflemen, snipers, rocket troops, tanks, monster trucks, a transforming Base Walker, jets, stealth bombers and the camo flight-deck Carrier.</small></span></label>
        <label class="fac" data-fac="reptile"><input type="radio" name="faction" value="reptile"><img src="assets/portrait_reptile.jpg?v=10.1n" alt="" width="320" height="240"><span><b>Reptilians</b><small>Living hive: Raiders, Spitters, Brutes and Shamans, spark and lance drones, the Hive Orb and the egg-laying Brood Ship. Organic buildings heal themselves.</small></span></label>
        <label class="fac" data-fac="nordic"><input type="radio" name="faction" value="nordic"><img src="assets/portrait_nordic.jpg?v=10.1n" alt="" width="320" height="240"><span><b>Nordics</b><small>Tall, golden-haired visitors with white-and-gold light tech. Few but mighty: Sentinels, Seers that heal, shield Guardians, the Tall White blademaster, Light-craft and the Lightship.</small></span></label>
        <label class="fac" data-fac="grey"><input type="radio" name="faction" value="grey"><img src="assets/portrait_grey.jpg?v=10.1n" alt="" width="320" height="240"><span><b>Greys</b><small>Big-eyed abductors in a swarm of cheap drones. Psionics stun, Abductors steal soldiers, Hybrids blend in, robot crawlers, crackling white orb drones, classic flying saucers with green tractor beams, and a Mothership that launches six saucers.</small></span></label>
      </div>
      <label class="opt"><input type="checkbox" id="graceOpt" checked> <span><b>No attacks for the first 10 minutes</b><br><small>Ceasefire for both sides: no damage, no targeting, no AI attacks, no Ion strikes. Building and harvesting continue.</small></span></label>
      <div class="mprow playrow"><button id="startBtn">Play vs AI</button><button id="mpBtn" class="secondary">Play Online</button></div>
      <button id="fsBtn" class="secondary">Full screen</button>
      <div id="mpPanel" hidden>
        <p class="mpnote">2-player online, peer-to-peer. Both players pick their faction above. One taps <b>Create room</b> and reads out the 5-letter code; the other types it and taps <b>Join</b>.</p>
        <div class="mprow"><button id="mpHost">Create room</button></div>
        <div id="mpCodeBox" hidden>Room code: <b id="mpCode"></b></div>
        <div class="mprow"><input id="mpJoinCode" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="mpJoin">Join</button></div>
        <div id="mpStatus" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>
<script>
// Boot guard: if a stale/partial cached module stops main.js from loading, the Start button would do nothing.
// Detect that and reload once with a cache-busting query; otherwise show a clear message instead of a dead menu.
(function () {
  var q = new URLSearchParams(location.search), tries = +(q.get('reload') || 0);
  function recover(why) {
    if (window.startGame) return;
    if (tries < 2) { q.set('reload', tries + 1); q.set('cb', Date.now()); location.replace(location.pathname + '?' + q.toString()); return; }
    var b = document.getElementById('startBtn'); if (b) b.textContent = 'Could not load the game - tap to retry';
    if (b) b.onclick = function () { q.set('reload', 0); q.set('cb', Date.now()); location.replace(location.pathname + '?' + q.toString()); };
    console.error('boot failed:', why);
  }
  window.addEventListener('error', function (e) { if (!window.startGame && e && (e.filename || '').indexOf('/src/') >= 0) setTimeout(function () { recover(e.message); }, 50); }, true);
  window.addEventListener('load', function () { setTimeout(function () { recover('main.js did not initialise'); }, 4000); });
  document.addEventListener('click', function (e) { if (e.target && e.target.id === 'startBtn' && !window.startGame) { window.__wantStart = true; e.target.textContent = 'Loading...'; } }, true);
})();
</script>
<script type="module" src="src/main.js?v=10.1n"></script>
</body>
</html>
