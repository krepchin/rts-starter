<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tiberium Skirmish — RTS Starter v9</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <aside id="sidebar">
    <div id="hud"><div id="credits">$0</div><div id="power">⚡ 0/0</div></div>
    <div id="powerBar" title="Power: produced (top) vs used (bottom)"><div id="powerMade"></div><div id="powerUsed"></div></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <button id="findBtn" title="Centre on selected units (Space / F, or double-tap a unit)">◎ Find my units</button>
    <div id="buildTabs"></div>
    <div id="buildMenu"></div>
    <div id="queueCtl"><button id="qPause">Pause</button><button id="qCancel">✕ Cancel</button></div>
    <div id="qStatus"></div>
    <div id="selInfo"></div>
    <div id="selActions"></div>
  </aside>
  <div id="banner" hidden></div>
  <div id="graceTimer" hidden></div>
  <div id="startMenu">
    <div class="panel">
      <h1>Tiberium Skirmish</h1>
      <div id="version">v9 · sketchbook edition</div>
      <label class="opt"><input type="checkbox" id="graceOpt" checked> <span><b>No attacks for the first 10 minutes</b><br><small>Ceasefire for both sides: no damage, no targeting, no AI attacks, no Ion strikes. Building and harvesting continue.</small></span></label>
      <button id="startBtn">Start Skirmish</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js?v=9"></script>
</body>
</html>
